<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyek 1 - Kartu Profil Responsif</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card-container">
    <div class="profile-card">
      <div class="avatar-wrapper">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Foto Profil" class="avatar">
      </div>
      <h2 class="name">I Putu Gangga Wili</h2>
      <p class="role">UI/UX Designer & Web Developer</p>
      <p class="bio">Sangat menyukai desain web yang bersih, minimalis, dan mudah digunakan. Berfokus pada pengalaman pengguna yang optimal.</p>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-num">1.2k</span>
          <span class="stat-label">Pengikut</span>
        </div>
        <div class="stat-item">
          <span class="stat-num">84</span>
          <span class="stat-label">Proyek</span>
        </div>
        <div class="stat-item">
          <span class="stat-num">4.9</span>
          <span class="stat-label">Rating</span>
        </div>
      </div>
      <button class="btn-follow">Ikuti Profil</button>
    </div>
  </main>
</body>
</html>
